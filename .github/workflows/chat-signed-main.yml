name: Genuine owner on-demand protected-main signed Windows source (NO RELEASE)
run-name: Chat-main-sign-comment-${{ github.event.comment.id || 0 }}

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/chat-signed-main.yml

permissions:
  contents: read

concurrency:
  group: owner-main-signed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  signed_main_source:
    name: Authenticate owner Issue 2 and attest true protected main (NONPUBLISHING)
    # Owner, issue, main, attempt and fleet identity are authenticated centrally.
    if: ${{ github.event_name == 'issue_comment' }}
    permissions:
      contents: read
      issues: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/chat-signed-main-source.yml@aec29c9ad5a9afa00d264ba60c9927c136610bca
    with:
      request_issue: 2
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
