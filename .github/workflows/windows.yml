name: Windows CI/CD
on:
  pull_request:
  # The shared candidate updater calls this workflow for its candidate branch.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@windows-ci
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  windows_required:
    name: Windows required summary
    if: ${{ always() && !startsWith(github.ref, 'refs/heads/release/') }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out pgextwin build infrastructure at the resolved build SHA
        if: ${{ needs.windows.outputs.build_sha != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: ${{ needs.windows.outputs.build_sha }}
          path: .pgextwin-build
      - name: Require full maintained-PG Windows matrix success
        env:
          WINDOWS_MATRIX_RESULT: ${{ needs.windows.result }}
          BUILD_SHA: ${{ needs.windows.outputs.build_sha }}
        run: |
          if [ -z "$BUILD_SHA" ]; then
            echo "WINDOWS REQUIRED SUMMARY DENIED: resolved build SHA unavailable" >&2
            exit 2
          fi
          python3 .pgextwin-build/scripts/required_windows_summary.py
